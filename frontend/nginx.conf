server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same origin for the UI and the API: `backend` is the compose service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A live eval run makes a couple of hundred model calls in one request.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vite writes content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path serves the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
